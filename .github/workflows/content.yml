          run_test tests/monster-s01/test_monster_s01.mjs node --import tsx ../content/tests/monster-s01/test_monster_s01.mjs
          run_test tests/monster-s02/test_monster_s02.mjs node --import tsx ../content/tests/monster-s02/test_monster_s02.mjs
          run_test tests/monster-a7/test_monster_a7.mjs node --import tsx ../content/tests/monster-a7/test_monster_a7.mjs
          run_test tests/zygomite/test_zygomite.mjs node --import tsx ../content/tests/zygomite/test_zygomite.mjs
          run_test tests/wyvern/test_wyvern.mjs node --import tsx ../content/tests/wyvern/test_wyvern.mjs
          run_test tests/giant-mole/test_giant_mole.mjs node --import tsx ../content/tests/giant-mole/test_giant_mole.mjs
          run_test tests/soulbane/test_soulbane.mjs node --import tsx ../content/tests/soulbane/test_soulbane.mjs
          exit "$failed"

      - name: Write job summary
        if: always()
        shell: bash
        env:
          ENGINE_SHA: ${{ steps.engine_ref.outputs.sha }}
          RS2CHECK_ERRORS: ${{ steps.rs2check.outputs.errors }}
          RS2CHECK_WARNINGS: ${{ steps.rs2check.outputs.warnings }}
        run: |
          {
            echo '## Content CI summary'
            echo
            echo "- Pinned engine SHA: \`${ENGINE_SHA:-unavailable}\`"
            echo "- rs2check errors: \`${RS2CHECK_ERRORS:-unavailable}\`"
            echo "- rs2check warnings: \`${RS2CHECK_WARNINGS:-unavailable}\`"
            echo
            echo '### Offline content test files'
            if [[ -f "$RUNNER_TEMP/content-test-results.tsv" ]]; then
              while IFS=$'\t' read -r file status; do
                printf -- '- `%s`: exit %s\n' "$file" "$status"
              done < "$RUNNER_TEMP/content-test-results.tsv"
            else
              echo '- Tests did not run.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
