name: Verify Content

on:
  push:
  pull_request:
    paths:
      - '**'
  workflow_dispatch:

jobs:
  verify:
    name: Content checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout content
        uses: actions/checkout@v6
        with:
          path: content

      - name: Read pinned engine SHA
        id: engine_ref
        working-directory: content
        shell: bash
        run: |
          set -euo pipefail
          sha="$(tr -d '\r\n' < .github/fr-engine-ref)"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected .github/fr-engine-ref to contain one full lowercase commit SHA" >&2
            exit 1
          fi
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout FR-engine at pinned SHA
        uses: actions/checkout@v6
        with:
          repository: Fairy-Ring/FR-engine
          ref: ${{ steps.engine_ref.outputs.sha }}
          ssh-key: ${{ secrets.FR_ENGINE_DEPLOY_KEY }}
          path: engine

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: Install engine dependencies
        working-directory: engine
        run: npm ci
      - name: Guard transmitted varps against 377 client readers
        working-directory: content
        run: node tests/check-varp-transmit.mjs

      - name: rs2check
        id: rs2check
        working-directory: engine
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/rs2check.json"
          set +e
          npx tsx tools/rs2check.ts --content ../content --json > "$report"
          check_status=$?
          set -e
          if [[ ! -s "$report" ]]; then
            echo "rs2check did not produce a JSON report (exit $check_status)" >&2
            if ((check_status == 0)); then
              exit 1
            fi
            exit "$check_status"
          fi
          node --input-type=module - "$report" "$check_status" <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const errors = report.summary.errors;
          const warnings = report.summary.warnings;
          const checkStatus = Number(process.argv[3]);
          if (!Number.isInteger(errors) || !Number.isInteger(warnings)) {
            throw new Error('rs2check report is missing numeric error/warning counts');
          }
          console.log(`rs2check: ${errors} errors, ${warnings} warnings`);
          appendFileSync(process.env.GITHUB_OUTPUT, `errors=${errors}\nwarnings=${warnings}\n`);
          if (checkStatus !== 0 || errors !== 0 || warnings !== 0 || report.internalError !== null) {
            process.exitCode = 1;
          }
          NODE

      - name: Build full content pack
        id: build_pack
        working-directory: engine
        # Mirror the engine .env: current free-ID varp appends change historical CRCs.
        env:
          BUILD_SRC_DIR: ../content
          BUILD_VERIFY: 'false'
        run: npm run build

      # Suite classification (all are transport-free and are run below; live-only: none).
      # tests/ root: CI — hm-salve compiled runtime uses the built pack and starts no server.
      # tests/wanted/: CI — four production interpreter scenarios, no server.
      # tests/multinpc-triggers/: CI — runtime.sh explicitly starts no server.
      # tests/fenkenstrain-completion/: CI — four compiled runtime tests and the offline static check;
      #   setup-iso.sh is an optional isolated-layout helper, not a test or a live-server requirement.
      # tests/fletching-choice/: CI — runtime.sh executes packed scripts/handlers without a world server.
      # tests/skill-menus/: CI — packed trigger, menu packet, reset and button tests; no world server.
      # tests/silver-casting/: CI — compiled furnace handler fills each Silver Casting slot; no engine is started.
      # tests/leather-batch/: CI — published Make1 baseline plus packed Make5/10 handlers and weak-queue processing; no server.
      # tests/teleother/: CI — compiled Player triggers and button handlers cover all three offers, settlement and recipient lifecycle; no server is started.
      # tests/giantdwarf-intro/: CI — compiled runtime/save-load checks; no engine is started.
      # tests/content-gaps/: CI — packed configuration/trigger integration, no server.
      # tests/elena-fence/: CI — packed map/dispatch runtime, runtime.sh starts no server.
      # tests/drop-tables/: CI — compiled KQ ScriptRunner outcomes, no server.
      # tests/priestperil-completion/: CI — compiled completion queue, Prayer reward in tenths, no server.
      # tests/string-charset/: CI — client-visible strings stay within the Client-Java 377 byte/font character set.
      # tests/combo-runes/: CI — all 122 original spell buttons versus compiled rune checks, and every existing row's payment.
      # tests/slayer-selector/: CI — deterministic packed cases and reduced seeded distribution, no server.
      # tests/ape-agility/: CI — compiled packed obstacle handlers, entry matrix and recovery checkpoints; no server.
      # tests/brim-dungeon/: CI — packed entrance, obstacle, lock and collision checks; no server.
      # tests/splitbark-service/: CI — packed wizard dialogue, labeled five-piece selector and inventory purchases; no server.
      - name: Run offline content tests
        id: content_tests
        working-directory: engine
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          results="$RUNNER_TEMP/content-test-results.tsv"
          : > "$results"
          run_test() {
            local file="$1"
            shift
            echo "::group::$file"
            local status=0
            if "$@"; then
              status=0
            else
              status=$?
              failed=1
            fi
            echo "::endgroup::"
            printf '%s\t%s\n' "$file" "$status" >> "$results"
            echo "$file: exit $status"
            return 0
          }

          run_test tests/string-charset/check_string_charset.mjs node ../content/tests/string-charset/check_string_charset.mjs ../content
          run_test tests/string-charset/check_string_charset.test.mjs node --test ../content/tests/string-charset/check_string_charset.test.mjs
          run_test tests/varp-scope/test_varp_scope.mjs node --import tsx ../content/tests/varp-scope/test_varp_scope.mjs
          run_test tests/wild-warn/test_wild_warn.mjs node --import tsx ../content/tests/wild-warn/test_wild_warn.mjs
          run_test tests/quest-points/test_quest_points.mjs node --import tsx ../content/tests/quest-points/test_quest_points.mjs
          run_test tests/equip-gates/test_equip_gates.mjs node --import tsx ../content/tests/equip-gates/test_equip_gates.mjs
          run_test tests/combo-runes/test-combo-runes.mjs node --import tsx ../content/tests/combo-runes/test-combo-runes.mjs
          run_test tests/slayer-selector/test_slayer_selector.mjs node --import tsx ../content/tests/slayer-selector/test_slayer_selector.mjs --mode ci --artifact-dir "$RUNNER_TEMP/slayer-selector"
          run_test tests/barrows/test_config.mjs node ../content/tests/barrows/test_config.mjs --content-root ../content
          run_test tests/citizen-tables/test_citizen_tables.mjs node --import tsx ../content/tests/citizen-tables/test_citizen_tables.mjs
          run_test tests/cfg-other/test_cfg_other.mjs node --import tsx ../content/tests/cfg-other/test_cfg_other.mjs
          run_test tests/npc-death/test_npc_death.mjs node --import tsx ../content/tests/npc-death/test_npc_death.mjs
          run_test tests/elf-viking-drops/test_elf_viking_drops.mjs node --import tsx ../content/tests/elf-viking-drops/test_elf_viking_drops.mjs
          run_test tests/cfg-npc/test_cfg_npc.mjs node --import tsx ../content/tests/cfg-npc/test_cfg_npc.mjs
          run_test tests/spawn-repair/test_spawn_repair.mjs node --import tsx ../content/tests/spawn-repair/test_spawn_repair.mjs
          run_test tests/wanted/start.mjs node --import tsx ../content/tests/wanted/start.mjs
          run_test tests/wanted/commorb.mjs node --import tsx ../content/tests/wanted/commorb.mjs
          run_test tests/wanted/savant.mjs node --import tsx ../content/tests/wanted/savant.mjs
          run_test tests/wanted/records.mjs node --import tsx ../content/tests/wanted/records.mjs
          run_test tests/drop-tables/test_kalphite_queen.mjs node --import tsx ../content/tests/drop-tables/test_kalphite_queen.mjs
          run_test tests/fenkenstrain-completion/test_fenk_handlers.mjs node --import tsx ../content/tests/fenkenstrain-completion/test_fenk_handlers.mjs
          run_test tests/fenkenstrain-completion/test_fenk_s3_rewards.mjs node --import tsx ../content/tests/fenkenstrain-completion/test_fenk_s3_rewards.mjs
          run_test tests/fenkenstrain-completion/test_fenk_follower_dialogue_follow.mjs node --import tsx ../content/tests/fenkenstrain-completion/test_fenk_follower_dialogue_follow.mjs
          run_test tests/fenkenstrain-completion/test_fenk_gardener_move.mjs node --import tsx ../content/tests/fenkenstrain-completion/test_fenk_gardener_move.mjs
          run_test tests/fenkenstrain-completion/test_fenk_offline.py python3 ../content/tests/fenkenstrain-completion/test_fenk_offline.py
          run_test tests/fenkenstrain-completion/test_fenk_s0.py python3 ../content/tests/fenkenstrain-completion/test_fenk_s0.py
          run_test tests/fenkenstrain-completion/test_fenk_s1.py python3 ../content/tests/fenkenstrain-completion/test_fenk_s1.py
          run_test tests/fenkenstrain-completion/test_fenk_s2.py python3 ../content/tests/fenkenstrain-completion/test_fenk_s2.py
          run_test tests/silver-casting/test_silver_casting.mjs node --import tsx ../content/tests/silver-casting/test_silver_casting.mjs
          run_test tests/smelt-batch/test_smelt_batch.mjs node --import tsx ../content/tests/smelt-batch/test_smelt_batch.mjs
          run_test tests/leather-batch/test_leather_batch.mjs node --import tsx ../content/tests/leather-batch/test_leather_batch.mjs
          run_test tests/desert-treasure/test_s3_contract.py python3 ../content/tests/desert-treasure/test_s3_contract.py
          run_test tests/desert-treasure/test_s1_contract.py python3 ../content/tests/desert-treasure/test_s1_contract.py
          run_test tests/desert-treasure/test_s6_contract.py python3 ../content/tests/desert-treasure/test_s6_contract.py
          run_test tests/teleother/test_teleother.mjs node --import tsx ../content/tests/teleother/test_teleother.mjs
          run_test tests/mortton-sanctity-drain/test_mortton_sanctity_drain.mjs node --import tsx ../content/tests/mortton-sanctity-drain/test_mortton_sanctity_drain.mjs
          run_test tests/rowboat/test_rowboat.mjs node --import tsx ../content/tests/rowboat/test_rowboat.mjs
          run_test tests/misc-services/test_misc_services.mjs node --import tsx ../content/tests/misc-services/test_misc_services.mjs
          run_test tests/regicide-travel/test_regicide_travel.mjs node --import tsx ../content/tests/regicide-travel/test_regicide_travel.mjs
          run_test tests/shantay/test_shantay.mjs node --import tsx ../content/tests/shantay/test_shantay.mjs
          run_test tests/food-drink/test_food_drink.mjs node --import tsx ../content/tests/food-drink/test_food_drink.mjs
          run_test tests/stair-links/test_stair_links.mjs node --import tsx ../content/tests/stair-links/test_stair_links.mjs
          run_test tests/desert-treasure/test_s8_contract.py python3 ../content/tests/desert-treasure/test_s8_contract.py
          run_test tests/giantdwarf-intro/test_giantdwarf_intro.mjs node --import tsx ../content/tests/giantdwarf-intro/test_giantdwarf_intro.mjs
          run_test tests/priestperil-completion/test_priestperil_reward.mjs node --import tsx ../content/tests/priestperil-completion/test_priestperil_reward.mjs
          run_test tests/multinpc-triggers/runtime.mts bash ../content/tests/multinpc-triggers/runtime.sh "$PWD"
          run_test tests/fletching-choice/runtime.mts bash ../content/tests/fletching-choice/runtime.sh "$PWD"
          run_test tests/skill-menus/runtime.mts bash ../content/tests/skill-menus/runtime.sh "$PWD"
          run_test tests/content-gaps/packed.mts bash ../content/tests/content-gaps/packed.sh "$PWD"
          run_test tests/ape-agility/test_ape_atoll.mjs node --import tsx ../content/tests/ape-agility/test_ape_atoll.mjs
          run_test tests/brim-dungeon/test_brim_dungeon.mjs node --import tsx ../content/tests/brim-dungeon/test_brim_dungeon.mjs
          run_test tests/splitbark-service/test_splitbark_service.mjs node --import tsx ../content/tests/splitbark-service/test_splitbark_service.mjs
          run_test tests/elena-fence/runtime.mts bash ../content/tests/elena-fence/runtime.sh "$PWD"
          run_test 'tests/hm-salve-runtime.mts + tests/hm-salve-runtime-body.mts' bash -c 'mkdir -p .tmp && cp ../content/tests/hm-salve-runtime.mts ../content/tests/hm-salve-runtime-body.mts .tmp/ && ./node_modules/.bin/tsx .tmp/hm-salve-runtime.mts'
          exit "$failed"

      - name: Write job summary
        if: always()
        shell: bash
        env:
          ENGINE_SHA: ${{ steps.engine_ref.outputs.sha }}
          RS2CHECK_ERRORS: ${{ steps.rs2check.outputs.errors }}
          RS2CHECK_WARNINGS: ${{ steps.rs2check.outputs.warnings }}
        run: |
          {
            echo '## Content CI summary'
            echo
            echo "- Pinned engine SHA: \`${ENGINE_SHA:-unavailable}\`"
            echo "- rs2check errors: \`${RS2CHECK_ERRORS:-unavailable}\`"
            echo "- rs2check warnings: \`${RS2CHECK_WARNINGS:-unavailable}\`"
            echo
            echo '### Offline content test files'
            if [[ -f "$RUNNER_TEMP/content-test-results.tsv" ]]; then
              while IFS=$'\t' read -r file status; do
                printf -- '- `%s`: exit %s\n' "$file" "$status"
              done < "$RUNNER_TEMP/content-test-results.tsv"
            else
              echo '- Tests did not run.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
